name: build-image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    # GB10 is arm64; GitHub's arm64 runner is enough to build (no GPU needed to compile).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:3bpw
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
